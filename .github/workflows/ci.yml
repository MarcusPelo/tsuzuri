name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/tsuzuri

  # Build the full release locally and install it on every platform the
  # installers and packages target.
  snapshot:
    name: Snapshot release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=before
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  install-macos:
    name: Install (macOS)
    needs: snapshot
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install script
        run: sh ./.github/scripts/install-test.sh

  install-linux:
    name: Install (${{ matrix.image }})
    needs: snapshot
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04", setup: "apt-get update && apt-get install -y python3 curl" }
          - { image: "debian:stable-slim", setup: "apt-get update && apt-get install -y python3 wget" }
          - { image: "fedora:latest", setup: "dnf install -y python3 tar gzip" }
          - { image: "alpine:latest", setup: "apk add --no-cache python3" }
          - { image: "archlinux:latest", setup: "pacman -Sy --noconfirm python" }
          - { image: "opensuse/tumbleweed", setup: "zypper -n install python3 curl tar gzip" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install script
        run: |
          docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" sh -c '
            set -e
            ${{ matrix.setup }}
            sh ./.github/scripts/install-test.sh
          '

  install-windows:
    name: Install (Windows)
    needs: snapshot
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install script
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'dist' -PassThru
          $up = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest 'http://127.0.0.1:8765/checksums.txt' -UseBasicParsing -TimeoutSec 2 | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { throw 'test server did not start' }
          $env:TSUZURI_BASE_URL = 'http://127.0.0.1:8765'
          $env:TSUZURI_INSTALL_DIR = "$PWD\bin"
          ./install.ps1
          & "$PWD\bin\tsuzuri.exe" --version
          Stop-Process $server
