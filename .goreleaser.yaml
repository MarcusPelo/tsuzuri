# GoReleaser config: https://goreleaser.com
#
# One download per platform:
#   tsuzuri-macos.tar.gz    universal binary (Intel + Apple Silicon)
#   tsuzuri-linux.tar.gz    x86-64, static: runs on every distribution
#   tsuzuri-windows.zip     x64 (also runs on Windows on ARM via emulation)
version: 2

project_name: tsuzuri

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: tsuzuri
    main: ./cmd/tsuzuri
    binary: tsuzuri
    env:
      # Pure Go and statically linked: no system libraries needed.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

universal_binaries:
  - id: tsuzuri
    replace: true

archives:
  - id: tsuzuri
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Version-free names so https://github.com/…/releases/latest/download/…
    # always points at the newest build.
    name_template: >-
      {{ .ProjectName }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# brew install jaisuriya-11/tap/tsuzuri
# Pushes a cask to github.com/jaisuriya-11/homebrew-tap on each release.
homebrew_casks:
  - name: tsuzuri
    ids: [tsuzuri]
    binaries: [tsuzuri]
    homepage: https://github.com/jaisuriya-11/tsuzuri
    description: Terminal notes app that keeps your notes as plain Markdown files
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    repository:
      owner: jaisuriya-11
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # The binary is not notarized; drop the quarantine flag so macOS runs it.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tsuzuri"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  header: |
    ## Install

    **macOS / Linux**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/jaisuriya-11/tsuzuri/main/install.sh | sh
    ```

    **Homebrew**
    ```sh
    brew install jaisuriya-11/tap/tsuzuri
    ```

    **Windows (PowerShell)**
    ```powershell
    irm https://raw.githubusercontent.com/jaisuriya-11/tsuzuri/main/install.ps1 | iex
    ```

    Or download the file for your system below and put `tsuzuri` on your `PATH`.

# The notes are the install header above, not a commit list.
changelog:
  disable: true
